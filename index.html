<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; height: 100vh; background: #fff; overflow: hidden; }

  /* Внешний блок: летает по экрану */
  .fly { position: absolute; perspective: 200px;
         animation: fly 8s ease-in-out infinite alternate; }

  /* Сам куб: крутится */
  .cube { width: 150px; height: 150px; position: relative;
          transform-style: preserve-3d;
          animation: spin 5s linear infinite; }

  /* Общий вид граней */
  .face { position: absolute; width: 150px; height: 150px;
          border: 2px solid #333; background: rgba(255, 0, 0, 0.85);
          display: flex; align-items: center; justify-content: center;
          font: bold 22px Arial; color: hsl(240, 100%, 50%); }

  /* Расставляем грани: поворот + сдвиг на половину размера */
  .front  { transform: translateZ(75px); }
  .back   { transform: rotateY(180deg) translateZ(75px); }
  .right  { transform: rotateY(90deg)  translateZ(75px); }
  .left   { transform: rotateY(-90deg) translateZ(75px); }
  .top    { transform: rotateX(90deg)  translateZ(75px); }
  .bottom { transform: rotateX(-90deg) translateZ(75px); }

  @keyframes spin { to { transform: rotateX(360deg) rotateY(720deg); } }

  @keyframes fly {
    0%   { left: 5%;  top: 10%; }
    25%  { left: 70%; top: 15%; }
    50%  { left: 65%; top: 65%; }
    75%  { left: 10%; top: 60%; }
    100% { left: 40%; top: 30%; }
  }
</style>
</head>
<body>
  <div class="fly">
    <div class="cube">
      <div class="face front">ты пидор</div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
</body>
</html>
